[package]
name = "seraph-memory-rs"
description = "Global MCP memory server over the SERAPH C FFI (candle backend)."
version = "0.1.0"
edition = "2021"
authors = ["Tree D Interactive LLC"]
license = "MIT"
repository = "https://github.com/Tree-D-Interactive-LLC/seraph-memory-mcp"
readme = "README.md"

[[bin]]
name = "seraph-memory-rs"
path = "src/main.rs"

[dependencies]
# Canonical safe Rust surface over the SERAPH cdylib. Depending on this crate
# (instead of hand-transcribing the C ABI) keeps the binding surface from
# drifting out of sync with the engine. Published as source in the seraph repo's
# git tree, whose default branch carries the latest release. Cargo.lock records the
# commit a build uses, so builds stay reproducible; `cargo update -p seraph` moves
# to the newest release, and build.rs fetches the engine DLL of the release the lock
# names. To hold a release instead, add `tag = "vX.Y.Z"`. For local iteration
# against the working copy, use a gitignored .cargo/config.toml `paths` override
# instead of editing this line.
seraph = { git = "https://github.com/Tree-D-Interactive-LLC/seraph" }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-async-rw", "transport-streamable-http-server"] }
# Serves the hosted mode (`--http`): the MCP endpoint, its bearer-token gate, health, backup.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
# Human-friendly time input for temporal recall. The engine speaks microseconds
# since the epoch; callers speak "7d" or "2026-07-01", and that conversion is an
# application-layer concern.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[profile.release]
opt-level = 2
